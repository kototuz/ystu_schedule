name: ystu_schedule
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

flutter:
  uses-material-design: true

  assets:
    - images/guide0.png
    - images/guide1.png
    - images/guide2.png
    - images/guide3.png

  fonts:
    - family: Lack
      fonts:
        - asset: fonts/lack-regular.otf
        - asset: fonts/lack-italic.otf

flutter_launcher_icons:
  android: true
  image_path_android: "icons/icon-1024x1024.png"
  adaptive_icon_background: "#004589"
  adaptive_icon_foreground: "icons/icon-foreground-1024x1024.png"
